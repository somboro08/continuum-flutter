name: Dart and Flutter CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  dart-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/continuum_core
          - packages/continuum_persistence
          - packages/continuum_recovery
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve dependencies
        working-directory: ${{ matrix.package }}
        run: dart pub get
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze
      - name: Test
        working-directory: ${{ matrix.package }}
        run: dart test

  flutter-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        working-directory: packages/continuum_lifecycle
        run: flutter pub get
      - name: Analyze
        working-directory: packages/continuum_lifecycle
        run: flutter analyze
      - name: Test
        working-directory: packages/continuum_lifecycle
        run: flutter test
